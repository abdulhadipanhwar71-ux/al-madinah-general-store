databases:
  - name: al-madinah-db
    plan: free
    databaseName: dukaanos_db
    user: dukaanos_user

services:
  # 1. FastAPI ASGI Backend Web Service
  - type: web
    name: al-madinah-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: al-madinah-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://al-madinah-store.onrender.com,https://al-madinah-general-store.vercel.app"
      - key: LOG_LEVEL
        value: info

  # 2. React Vite Frontend Static Site
  - type: web
    name: al-madinah-store
    runtime: static
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: al-madinah-backend
          property: host
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: al-madinah-backend
          property: host
